name: Афиша

# Идёт на серверах GitHub, а не на Маке. Маку тут делать нечего: launchd не
# пускают в ~/Documents без Full Disk Access, и такие задачи ломаются молча.
#
# Расписание одно и ежечасное. Частые интервалы GitHub не выполняет: «каждые
# 20 минут» на деле запускалось раз в три часа, и ответ «да» ждал полдня. Час
# он держит надёжно, а внутри прогон полсотни минут слушает телеграм длинным
# опросом — реакция приходит за секунды. Утренний вопрос и недельная сводка
# идут тем же прогоном; во сколько именно — решает сам скрипт по московскому
# времени, а не по тому, когда GitHub соизволил запуститься.
on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  afisha:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    env:
      TG_TOKEN: ${{ secrets.TG_TOKEN }}
      TG_CHAT:  ${{ secrets.TG_CHAT }}
    steps:
      - uses: actions/checkout@v5
        with: { ref: source }

      - name: Разобрать накопившееся
        run: python3 build/watch.py apply | tee /tmp/out.txt

      # Когда спрашивать и когда слать сводку, решает сам скрипт: «шесть утра
      # по Москве или первая возможность после, но раз в сутки». Привязка к
      # часу на стенных часах здесь не годится — расписание GitHub опаздывает,
      # и опоздавший прогон промахнулся бы мимо окна.
      - name: Спросить про прошедшие даты
        run: python3 build/watch.py ask

      - name: Недельная сводка
        run: python3 build/watch.py report

      # Слушаем чат до конца часа. Если пришло «да» — выходим раньше и публикуем.
      - name: Слушать чат
        run: |
          grep -q 'publish=1' /tmp/out.txt || python3 build/watch.py listen | tee -a /tmp/out.txt

      - name: Собрать и выложить
        run: |
          grep -q 'publish=1' /tmp/out.txt || { echo "публиковать нечего"; exit 0; }
          python3 build/site.py build
          python3 build/deploy.py
          git config --global user.name  "Афиша"
          git config --global user.email "actions@github.com"
          git clone --depth 1 --branch main \
            "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" live
          # .git у клона не трогаем — ни при очистке, ни при копировании.
          # У site/ есть свой .git (deploy.py его заводит), и «cp -a site/.»
          # затирал им .git клона: коммит проходил, а пушить было уже некуда.
          find live -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          find site -mindepth 1 -maxdepth 1 ! -name .git -exec cp -a {} live/ \;
          cd live
          git add -A
          git diff --cached --quiet || { git commit -m "Прошедшие даты убраны"; git push; }

      # Ящик с правками и отметка о заданном вопросе должны пережить прогон,
      # иначе завтра всё спросится заново, а письма потеряются.
      - name: Запомнить состояние
        if: always()
        run: |
          git config --global user.name  "Афиша"
          git config --global user.email "actions@github.com"
          # Именно «-A build/», а не перечисление файлов: pending.json то есть,
          # то нет, а git add с несуществующим путём падает целиком и не
          # индексирует вообще ничего — из-за этого состояние не сохранялось,
          # и бот каждые двадцать минут заново рапортовал об одном письме.
          git add -A build/
          git diff --cached --quiet && { echo "состояние не менялось"; exit 0; }
          git commit -m "Состояние утренней проверки"
          git pull --rebase -q origin source || true
          git push "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:source
