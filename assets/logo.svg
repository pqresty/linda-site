<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 461.1 100" role="img" aria-label="ЛИNДА">
  <title>ЛИNДА</title>
  <!-- Обмерено с афиши 2025 (ЛИНДА. АФИША 2025-1 (ШАБЛОН).psd).
       Высота прописной 100, штрих ~16.7.
       Знак построен на треугольниках: Л — лямбда без стойки,
       Д и А — те же треугольники, различаются вырезом.

       Все нижние грани уведены на y=102 и обрезаются viewBox: если грань
       выреза совпадает с гранью контура, антиалиасинг оставляет между
       ножками тонкий шов. Уводить один только вырез нельзя — ниже контура
       он перестаёт вычитаться и сам заливается. -->
  <g fill="currentColor" fill-rule="evenodd">
    <!-- Л : лямбда, обе ноги расходятся от вершины -->
    <path d="M31.1 0 H53.3 L85 102 H-0.6 Z
             M39.9 14 L66.8 102 H13.8 Z"/>

    <!-- И : диагональ снизу слева вверх направо -->
    <path d="M94.8 0 H111.1 V70 L152.8 0 H170.1 V102 H152.8 V30 L111.1 102 H94.8 Z"/>

    <!-- N : зеркало И -->
    <path d="M188.2 0 H204.9 L246.5 70 V0 H263.5 V102 H246.5 L204.9 30 V102 H188.2 Z"/>

    <!-- Д : треугольник, вырез обрывается выше базовой линии -->
    <path d="M309.7 0 H332.3 L366.7 102 H276.4 Z
             M319.3 10.4 L341.9 85 H296.7 Z"/>

    <!-- А : тот же треугольник, но с низкой перекладиной -->
    <path d="M406.2 0 H427.5 L461.8 102 H372.6 Z
             M415 13.4 L429.7 62 H400.3 Z
             M394.4 80 H435.8 L443.5 102 H386.9 Z"/>
  </g>
</svg>
